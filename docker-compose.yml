# รันทั้งระบบในเครื่อง:  docker compose up --build   แล้วเปิด http://localhost:8080
# ค่าลับอ่านจากไฟล์ .env ที่ root ของ repo (คัดลอกจาก .env.example) — ห้าม commit .env
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: principlesproject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?กรุณาตั้ง DB_PASSWORD ในไฟล์ .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d principlesproject"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/principlesproject
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?กรุณาตั้ง ADMIN_PASSWORD ในไฟล์ .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads

volumes:
  postgres_data:
  uploads_data:
