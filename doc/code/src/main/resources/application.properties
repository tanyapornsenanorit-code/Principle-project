spring.application.name=costumerentalsystem
server.port=8081

# ---------- PostgreSQL (ค่าลับมาจาก Environment Variables — ห้าม hardcode รหัสผ่านใน repo) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/costume_rental_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=punchwha2548

# ---------- JPA / Hibernate ----------
# Schema ถูกสร้างโดย Flyway เท่านั้น — Hibernate แค่ตรวจว่า Entity ตรงกับตาราง (validate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- File Upload ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------- Mail (ดึงจาก Environment Variables) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
