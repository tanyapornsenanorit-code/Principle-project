<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Costume Rental</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&family=Prompt:wght@300;400;500;600&display=swap');

        :root {
            --pink-main: #ff9fb3;
            --pink-light: #ffc0cb;
            --pink-dark: #f06292;
            --pink-bg: #fff5f7;
        }

        body {
            font-family: 'Montserrat', 'Prompt', sans-serif;
            background-color: var(--pink-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-princess {
            font-family: 'Pinyon Script', cursive;
            font-weight: normal;
            color: var(--pink-dark);
        }

        .forgot-card {
            max-width: 440px;
            border-radius: 1rem;
            border: none;
            box-shadow: 0 10px 30px rgba(240, 98, 146, 0.12);
        }

        .brand-header {
            background: white;
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
            border-bottom: 1px solid #fce4ec;
        }

        .btn-pink { 
            background-color: var(--pink-main); 
            border-color: var(--pink-main); 
            color: white; 
        }
        .btn-pink:hover { 
            background-color: var(--pink-dark); 
            border-color: var(--pink-dark); 
            color: white; 
        }

        .text-pink { color: var(--pink-dark) !important; }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="card forgot-card shadow-lg bg-white w-100 m-3">
            
            <!-- Header ธีมเจ้าหญิง -->
            <div class="brand-header text-center p-4">
                <span class="font-princess display-4 text-pink d-block mb-1">Costume Rental</span>
                <h4 class="fw-bold mb-1 text-dark">ลืมรหัสผ่าน</h4>
                <p class="small text-muted mb-0" th:text="${otpSent == true} ? 'กรอกรหัส OTP และตั้งรหัสผ่านใหม่' : 'กรอกอีเมลเพื่อขอรับรหัส OTP'"></p>
            </div>

            <div class="card-body p-4">
                <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
                <div th:if="${message}" class="alert alert-success py-2 small" th:text="${message}"></div>

                <!-- ขั้นตอนที่ 1: กรอกอีเมลรับ OTP -->
                <form th:if="${otpSent != true}" th:action="@{/forgot-password/send-otp}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">
                            <i class="bi bi-envelope-fill me-1 text-pink"></i> อีเมลที่ใช้ลงทะเบียน
                        </label>
                        <input type="email" name="email" class="form-control rounded-pill px-3 py-2" placeholder="example@email.com" th:value="${email}" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-pink w-100 py-2 rounded-pill fw-bold shadow-sm">ส่งรหัส OTP ไปยังอีเมล</button>
                </form>

                <!-- ขั้นตอนที่ 2: กรอก OTP และตั้งรหัสผ่านใหม่ -->
                <form th:if="${otpSent == true}" th:action="@{/forgot-password/reset}" method="post">
                    <input type="hidden" name="email" th:value="${email}">

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">
                            <i class="bi bi-shield-lock-fill me-1 text-pink"></i> รหัส OTP (เช็คใน Terminal / อีเมล)
                        </label>
                        <input type="text" name="otp" class="form-control text-center fs-5 rounded-pill" placeholder="กรอกรหัส 6 หลัก" maxlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">
                            <i class="bi bi-lock-fill me-1 text-pink"></i> กำหนดรหัสผ่านใหม่
                        </label>
                        <input type="password" name="newPassword" class="form-control rounded-pill px-3 py-2" placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-pink w-100 py-2 rounded-pill fw-bold shadow-sm">บันทึกรหัสผ่านใหม่</button>
                </form>

                <div class="text-center mt-3 pt-3 border-top">
                    <a th:href="@{/login}" class="text-decoration-none small text-pink fw-bold">← กลับไปยังหน้าเข้าสู่ระบบ</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
