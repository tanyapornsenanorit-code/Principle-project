<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Costume Rental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&family=Prompt:wght@300;400;500;600&display=swap');

        :root {
            --pink-main: #ff9fb3;
            --pink-light: #ffc0cb;
            --pink-dark: #f06292;
            --pink-bg: #fff5f7;
        }

        body {
            font-family: 'Montserrat', 'Prompt', sans-serif;
            background-color: var(--pink-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-princess {
            font-family: 'Pinyon Script', cursive;
            font-weight: normal;
            color: var(--pink-dark);
        }

        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(240, 98, 146, 0.12);
            max-width: 420px;
            width: 100%;
            background: #ffffff;
        }

        .btn-pink { 
            background-color: var(--pink-main); 
            border-color: var(--pink-main); 
            color: white; 
        }
        .btn-pink:hover { 
            background-color: var(--pink-dark); 
            border-color: var(--pink-dark); 
            color: white; 
        }

        .text-pink { color: var(--pink-dark) !important; }
    </style>
</head>
<body>

    <div class="container p-3 d-flex justify-content-center">
        <div class="card card-custom mx-auto p-4 p-md-4 shadow-lg">
            <div class="text-center mb-3 pt-2">
                <span class="font-princess display-4 text-pink d-block mb-1">Costume Rental</span>
                <h4 class="fw-bold text-dark mb-1">ตั้งรหัสผ่านใหม่</h4>
                <p class="text-muted small">สำหรับผู้ใช้งาน: <span class="fw-bold text-pink" th:text="${username}">User</span></p>
            </div>

            <div th:if="${error}" class="alert alert-danger py-2 small text-center rounded-pill mb-3" th:text="${error}"></div>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="username" th:value="${username}">

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">รหัสผ่านใหม่</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 rounded-start-pill ps-3"><i class="bi bi-lock text-pink"></i></span>
                        <input type="password" name="newPassword" class="form-control bg-light border-start-0 rounded-end-pill" placeholder="••••••••" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">ยืนยันรหัสผ่านใหม่</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 rounded-start-pill ps-3"><i class="bi bi-check-circle text-pink"></i></span>
                        <input type="password" name="confirmPassword" class="form-control bg-light border-start-0 rounded-end-pill" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-pink w-100 rounded-pill py-2 fw-bold shadow-sm mb-3">
                    <i class="bi bi-save me-1"></i> บันทึกรหัสผ่านใหม่
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
