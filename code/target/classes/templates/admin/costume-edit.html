<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Costume - Princess Collection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&family=Prompt:wght@300;400;500;600&display=swap');

        :root {
            --pink-main: #ff9fb3;
            --pink-light: #ffc0cb;
            --pink-dark: #f06292;
            --pink-bg: #fff5f7;
        }

        body {
            font-family: 'Montserrat', 'Prompt', sans-serif;
            background-color: var(--pink-bg);
        }

        .font-princess {
            font-family: 'Pinyon Script', cursive;
            font-weight: normal;
            color: var(--pink-dark);
        }

        .btn-pink { background-color: var(--pink-main); border-color: var(--pink-main); color: white; }
        .btn-pink:hover { background-color: var(--pink-dark); border-color: var(--pink-dark); color: white; }
        .text-pink { color: var(--pink-dark) !important; }

        .form-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(240, 98, 146, 0.1);
        }
        
        .upload-box {
            border: 2px dashed #ffc0cb;
            background-color: #ffffff;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .upload-box:hover {
            border-color: var(--pink-main);
            background-color: var(--pink-bg);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm border-bottom py-3">
    <div class="container justify-content-center">
        <a class="navbar-brand font-princess fs-2 mb-0 text-pink" th:href="@{/}">Costume Rental</a>
    </div>
</nav>

<div class="container my-5" style="max-width: 650px;">
    <div class="card form-card">
        <div class="card-header bg-white border-bottom-0 pt-4 pb-0 text-center">
            <h2 class="font-princess mb-0">Edit Costume</h2>
            <p class="text-muted small">แก้ไขข้อมูลชุดรหัส: <span class="fw-bold text-pink" th:text="${costume.id}">ID</span></p>
        </div>
        
        <div class="card-body p-4 p-md-5 pt-3">
            <!-- 🟢 แก้ไข Action ให้ชี้ไปที่ /costumes/update/{id} ถูกต้องตาม Controller -->
            <form th:action="@{/costumes/update/{id}(id=${costume.id})}" th:object="${costume}" method="post" enctype="multipart/form-data">
                
                <!-- ซ่อน ID ของชุดไว้เพื่อให้อัปเดตถูกเรคคอร์ด -->
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="name" class="form-label fw-medium text-secondary small">Costume Name (ชื่อชุดเช่า) <span class="text-danger">*</span></label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required />
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="category" class="form-label fw-medium text-secondary small">Category (หมวดหมู่) <span class="text-danger">*</span></label>
                        <select id="category" th:field="*{category}" class="form-select" required>
                            <option value="ชุดไทย">ชุดไทย</option>
                            <option value="ชุดสูท">ชุดสูท</option>
                            <option value="ชุดราตรี">ชุดราตรี</option>
                            <option value="ชุดแฟนซี">ชุดแฟนซี</option>
                            <option value="อื่น ๆ">อื่น ๆ</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="price" class="form-label fw-medium text-secondary small">Rental Price (ค่าเช่าต่อวัน) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">฿</span>
                            <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" required />
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label fw-medium text-secondary small">Description (รายละเอียดเพิ่มเติม)</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>

                <!-- ส่วนอัปโหลดรูปภาพใหม่ -->
                <div class="mb-3">
                    <label class="form-label fw-medium text-secondary small">Update Image (เปลี่ยนรูปภาพใหม่)</label>
                    <div class="upload-box text-center p-4 position-relative" id="drop-zone" onclick="document.getElementById('imageFile').click()">
                        <div id="preview-container" class="d-none mb-2">
                            <img id="image-preview" src="#" alt="Preview" class="img-fluid rounded shadow-sm" style="max-height: 220px; object-fit: cover;">
                        </div>
                        <div id="upload-placeholder">
                            <i class="bi bi-image display-4 text-pink mb-2 d-block"></i>
                            <span class="fw-bold text-dark d-block">คลิกที่นี่เพื่อเปลี่ยนรูปภาพ (ถ้ามี)</span>
                        </div>
                    </div>
                    <input type="file" id="imageFile" name="file" accept="image/*" class="d-none" onchange="previewImage(event)">
                </div>

                <div class="mb-4">
                    <label for="status" class="form-label fw-medium text-secondary small">Status (อัปเดตสถานะ)</label>
                    <select id="status" th:field="*{status}" class="form-select">
                        <option value="AVAILABLE">ว่าง (Available)</option>
                        <option value="RESERVED">ติดจอง (Booked)</option>
                        <option value="LAUNDRY">ส่งซัก (In Laundry)</option>
                        <option value="WAITING_RETURN">รอคืน (Pending)</option>
                    </select>
                </div>

                <div class="d-flex gap-2 justify-content-end border-top pt-4">
                    <a th:href="@{/admin/dashboard}" class="btn btn-light px-4 rounded-pill">Cancel</a>
                    <button type="submit" class="btn btn-pink px-5 rounded-pill fw-bold">
                        <i class="bi bi-save me-1"></i> Update Costume
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('image-preview');
        const previewContainer = document.getElementById('preview-container');
        const placeholder = document.getElementById('upload-placeholder');

        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                previewContainer.classList.remove('d-none');
                placeholder.classList.add('d-none');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
