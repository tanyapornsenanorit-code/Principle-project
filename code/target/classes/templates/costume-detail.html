<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costume Detail - Princess Collection</title>
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        /* Import Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&family=Prompt:wght@300;400;500;600&display=swap');

        /* Theme Colors */
        :root {
            --pink-main: #ff9fb3;
            --pink-light: #ffc0cb;
            --pink-dark: #f06292;
            --pink-bg: #fff5f7;
        }

        body {
            font-family: 'Montserrat', 'Prompt', sans-serif;
            background-color: var(--pink-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Typography */
        .font-princess {
            font-family: 'Pinyon Script', cursive;
            color: var(--pink-dark);
            text-shadow: 1px 1px 2px rgba(255,192,203,0.3);
        }
        .text-pink { color: var(--pink-dark) !important; }

        /* Buttons */
        .btn-pink { 
            background: linear-gradient(135deg, var(--pink-main) 0%, var(--pink-dark) 100%);
            border: none; 
            color: white; 
            transition: all 0.3s ease;
        }
        .btn-pink:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 98, 146, 0.4);
            color: white;
        }
        .btn-outline-pink { 
            color: var(--pink-dark); 
            border: 2px solid var(--pink-light); 
            background-color: white;
        }
        .btn-outline-pink:hover { 
            background-color: var(--pink-light); 
            color: var(--pink-dark); 
            border-color: var(--pink-light);
        }

        /* Detail Card Styling */
        .detail-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(240, 98, 146, 0.08);
            border: 1px solid rgba(255, 192, 203, 0.3);
            overflow: hidden;
            position: relative;
        }
        
        .detail-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 100%);
        }

        .img-container {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            border: 1px solid #f8f9fa;
        }
        
        .img-container img {
            width: 100%;
            height: auto;
            max-height: 550px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .img-container:hover img {
            transform: scale(1.03);
        }

        .price-tag {
            background: var(--pink-bg);
            border-radius: 15px;
            padding: 1.5rem;
            border: 1px dashed var(--pink-main);
        }

        .info-label {
            color: #8c8285;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }
        
        .info-value {
            color: #4a4a4a;
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Custom Separator */
        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--pink-dark);
            margin: 1.5rem 0;
        }
        .separator::before, .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--pink-light);
            opacity: 0.5;
        }
        .separator:not(:empty)::before { margin-right: .5em; }
        .separator:not(:empty)::after { margin-left: .5em; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm border-bottom py-2">
        <div class="container">
            <a class="navbar-brand font-princess fs-2 mb-0" th:href="@{/}">
                Costume Rental
            </a>
            <a th:href="@{/}" class="btn btn-outline-pink btn-sm rounded-pill px-4">
                <i class="bi bi-house-door me-1"></i> หน้าร้าน (Home)
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5 flex-grow-1">
        
        <!-- กรณีพบข้อมูลชุด -->
        <div th:if="${costume != null}" class="detail-card p-4 p-md-5 mx-auto" style="max-width: 1000px;">
            <div class="row align-items-center">
                
                <!-- ฝั่งรูปภาพ -->
                <div class="col-md-6 mb-4 mb-md-0">
                    <div class="img-container">
                        <img th:src="${costume.imageUrl != null and !costume.imageUrl.isEmpty() ? costume.imageUrl : 'https://placehold.co/600x800?text=Princess+Costume'}" 
                             alt="Costume Image">
                    </div>
                </div>
                
                <!-- ฝั่งรายละเอียด -->
                <div class="col-md-6 ps-md-5">
                    
                    <!-- 🟢 ปรับเปลี่ยนพื้นหลังป้ายหมวดหมู่ให้เป็นสีชมพูอ่อน ตัวหนังสือสีชมพูเข้ม -->
                    <span class="badge rounded-pill px-3 py-2 mb-3 shadow-sm fs-6 fw-bold" 
                          style="background-color: var(--pink-bg); color: var(--pink-dark); border: 1px solid var(--pink-light);" 
                          th:text="${costume.category ?: 'ไม่ระบุหมวดหมู่'}">หมวดหมู่</span>
                    
                    <h1 class="fw-bold text-dark mb-2" style="font-size: 2.2rem;" th:text="${costume.name}">ชื่อชุด</h1>
                    
                    <div class="separator"><i class="bi bi-suit-heart-fill"></i></div>
                    
                    <div class="mb-4">
                        <div class="info-label">รายละเอียด (Description)</div>
                        <div class="info-value text-muted lh-lg mt-1" th:text="${costume.description ?: 'ไม่มีรายละเอียดเพิ่มเติม'}">รายละเอียดชุด...</div>
                    </div>
                    
                    <div class="price-tag mb-4 text-center">
                        <div class="info-label mb-1">ค่าเช่าต่อวัน (Rental Price)</div>
                        <div class="text-pink fw-bold" style="font-size: 2.5rem;">
                            <span th:text="${costume.price != null ? #numbers.formatDecimal(costume.price, 0, 'COMMA', 0, 'POINT') : '0'}">0</span>
                            <span class="fs-4 text-muted fw-normal">THB</span>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-3">
                        <!-- เช็คสถานะชุด -->
                        <a th:if="${costume.status.name() == 'AVAILABLE'}" 
                           th:href="@{/rentals/new/{id}(id=${costume.id})}" 
                           class="btn btn-pink btn-lg rounded-pill fw-bold fs-5 shadow-sm py-3">
                           <i class="bi bi-bag-heart-fill me-2"></i> ดำเนินการเช่าชุดนี้
                        </a>
                           
                        <button th:if="${costume.status.name() != 'AVAILABLE'}" 
                                class="btn btn-secondary btn-lg rounded-pill fw-bold fs-5 shadow-sm py-3" disabled>
                           <i class="bi bi-lock-fill me-2"></i> ชุดนี้ไม่ว่าง (ถูกเช่า/ติดจอง)
                        </button>
                        
                        <a th:href="@{/}" class="btn btn-outline-pink btn-lg rounded-pill fw-medium py-2 mt-2">
                           <i class="bi bi-arrow-left me-2"></i> กลับไปเลือกชุดอื่น
                        </a>
                    </div>
                    
                </div>
            </div>
        </div>

        <!-- กรณีไม่พบข้อมูล -->
        <div th:if="${costume == null}" class="text-center py-5 bg-white rounded-4 shadow-sm mx-auto" style="max-width: 600px;">
            <i class="bi bi-search-heart text-pink display-1 d-block mb-3"></i>
            <h2 class="text-dark fw-bold mb-3">Oops! ไม่พบชุดที่คุณตามหา</h2>
            <p class="text-muted mb-4">ชุดนี้อาจถูกลบออกจากระบบ หรือ URL ไม่ถูกต้อง</p>
            <a th:href="@{/}" class="btn btn-pink rounded-pill px-5 py-2 fw-bold shadow-sm">
                <i class="bi bi-house-heart-fill me-2"></i> กลับไปหน้าร้าน
            </a>
        </div>
        
    </div>

    <!-- Footer -->
    <footer class="bg-white border-top py-4 text-center text-muted mt-auto">
        <div class="container">
            <small class="font-princess fs-4 d-block mb-1 text-pink">Costume Rental</small>
            <small>Costume Rental System Project</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
