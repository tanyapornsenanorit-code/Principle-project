<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Costume - Princess Collection</title>
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&family=Prompt:wght@300;400;500;600&display=swap');

        :root {
            --pink-main: #ff9fb3;
            --pink-light: #ffc0cb;
            --pink-dark: #f06292;
            --pink-bg: #fff5f7;
        }

        body {
            font-family: 'Montserrat', 'Prompt', sans-serif;
            background-color: var(--pink-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .font-princess {
            font-family: 'Pinyon Script', cursive;
            color: var(--pink-dark);
        }
        .text-pink { color: var(--pink-dark) !important; }

        .btn-pink { 
            background: linear-gradient(135deg, var(--pink-main) 0%, var(--pink-dark) 100%);
            border: none; 
            color: white; 
            transition: all 0.3s ease;
        }
        .btn-pink:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 98, 146, 0.4);
            color: white;
        }
        .btn-outline-pink { 
            color: var(--pink-dark); 
            border: 2px solid var(--pink-light); 
            background-color: white;
        }
        .btn-outline-pink:hover { 
            background-color: var(--pink-light); 
            color: var(--pink-dark); 
        }

        .form-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(240, 98, 146, 0.08);
            border: 1px solid rgba(255, 192, 203, 0.3);
            overflow: hidden;
            position: relative;
        }
        .form-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 100%);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm border-bottom py-2">
        <div class="container">
            <a class="navbar-brand font-princess fs-2 mb-0" th:href="@{/}">
                Princess Collection
            </a>
            <a th:href="@{/}" class="btn btn-outline-pink btn-sm rounded-pill px-4">
                <i class="bi bi-house-door me-1"></i> หน้าร้าน (Home)
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5 flex-grow-1" style="max-width: 700px;">
        
        <div class="form-card p-4 p-md-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-dark"><i class="bi bi-calendar2-heart text-pink me-2"></i>ฟอร์มจองเช่าชุด</h2>
                <p class="text-muted small">กรอกข้อมูลการใช้งานและเลือกช่วงเวลาที่คุณต้องการเช่าชุด</p>
            </div>

            <!-- แสดงชื่อชุดที่กำลังจะเช่า (ถ้ามีส่งค่า costume มา) -->
            <div th:if="${costume != null}" class="alert alert-light border d-flex align-items-center mb-4 rounded-4 p-3">
                <img th:src="${costume.imageUrl}" class="rounded-3 me-3" style="width: 60px; height: 60px; object-fit: cover;">
                <div>
                    <h6 class="fw-bold mb-1 text-dark" th:text="${costume.name}">ชื่อชุด</h6>
                    <span class="text-pink fw-bold" th:text="${#numbers.formatDecimal(costume.pricePerDay, 0, 'COMMA', 0, 'POINT') + ' ฿ / วัน'}">0 ฿</span>
                </div>
            </div>

            <!-- ฟอร์มส่งข้อมูลการเช่า -->
            <div class="alert alert-danger rounded-4" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/rentals/save}" method="post">
                <!-- ส่ง Costume ID ไปด้วย -->
                <input type="hidden" name="costumeId" th:value="${costume != null ? costume.id : ''}">

                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary">วันที่เริ่มต้นเช่า (Start Date)</label>
                    <input type="date" name="startDate" class="form-control form-control-lg rounded-pill fs-6" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary">วันที่คืนชุด (End Date)</label>
                    <input type="date" name="endDate" class="form-control form-control-lg rounded-pill fs-6" required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-pink btn-lg rounded-pill fw-bold py-3 shadow-sm">
                        <i class="bi bi-check-circle-fill me-2"></i> ยืนยันการจองเช่าชุด
                    </button>
                    <a th:href="@{/}" class="btn btn-outline-pink btn-lg rounded-pill py-2">
                        ยกเลิก
                    </a>
                </div>
            </form>
        </div>

    </div>

    <!-- Footer -->
    <footer class="bg-white border-top py-4 text-center text-muted mt-auto">
        <div class="container">
            <small class="font-princess fs-4 d-block mb-1 text-pink">Princess Collection</small>
            <small>Costume Rental System Project</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
