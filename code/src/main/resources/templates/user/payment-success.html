<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Submission - Costume Rental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&family=Prompt:wght@300;400;500;600&display=swap');

        :root {
            --pink-main: #ff9fb3;
            --pink-light: #ffc0cb;
            --pink-dark: #f06292;
            --pink-bg: #fff5f7;
        }

        body {
            font-family: 'Montserrat', 'Prompt', sans-serif;
            background-color: var(--pink-bg);
            min-height: 100vh;
        }

        .font-princess {
            font-family: 'Pinyon Script', cursive;
            font-weight: normal;
            color: var(--pink-dark);
        }

        .success-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(240, 98, 146, 0.12);
            background: #ffffff;
        }

        .btn-pink { 
            background-color: var(--pink-main); 
            border-color: var(--pink-main); 
            color: white; 
        }
        .btn-pink:hover { 
            background-color: var(--pink-dark); 
            border-color: var(--pink-dark); 
            color: white; 
        }

        .btn-outline-pink {
            color: var(--pink-dark);
            border-color: var(--pink-main);
        }
        .btn-outline-pink:hover {
            background-color: var(--pink-bg);
            color: var(--pink-dark);
            border-color: var(--pink-main);
        }

        .text-pink { color: var(--pink-dark) !important; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card success-card shadow-lg text-center p-4 p-md-5">
                <div class="card-body p-0">
                    <!-- โลโก้แบรนด์สไตล์เจ้าหญิง -->
                    <span class="font-princess display-3 text-pink d-block mb-2">Costume Rental</span>
                    
                    <div class="fs-1 text-pink mb-3">
                        <i class="bi bi-hourglass-split"></i>
                    </div>
                    
                    <h3 class="fw-bold mb-2 text-dark">ส่งแจ้งชำระเงินเรียบร้อยแล้ว</h3>
                    
                    <p class="text-muted small mb-4">
                        ระบบได้รับข้อมูลการแจ้งชำระเงินของคุณแล้ว ขณะนี้รายการอยู่ระหว่างรอเจ้าหน้าที่ตรวจสอบหลักฐาน หากตรวจสอบผ่าน สถานะคำสั่งเช่าจะเปลี่ยนเป็นชำระเงินแล้วและเข้าสู่ขั้นตอนจัดส่งต่อไป
                    </p>
                    
                    <div class="d-grid gap-2 col-10 mx-auto">
                        <a th:href="@{/orders}" class="btn btn-pink btn-lg rounded-pill fw-bold fs-6 shadow-sm">
                            <i class="bi bi-box2-heart me-1"></i> ดูสถานะคำสั่งเช่า
                        </a>
                        <a th:href="@{/}" class="btn btn-outline-pink btn-sm rounded-pill py-2 fw-medium">
                            <i class="bi bi-house-door me-1"></i> กลับหน้าหลัก
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
