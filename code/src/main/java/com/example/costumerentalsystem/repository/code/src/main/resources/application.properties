spring.application.name=costumerentalsystem

# อ่านไฟล์ .env ตอนรันในเครื่อง (ถ้าไม่มีไฟล์จะข้ามไป — บน Railway ใช้ Variables แทน)
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
server.port=${PORT:8080}

# ---------- PostgreSQL (ค่าลับมาจาก Environment Variables — ห้าม hardcode รหัสผ่านใน repo) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/principlesproject}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# Schema ถูกสร้างโดย Flyway เท่านั้น — Hibernate แค่ตรวจว่า Entity ตรงกับตาราง (validate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- File Upload ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# โฟลเดอร์เก็บรูปที่อัปโหลด (Railway: mount Volume ที่ /data แล้วตั้ง UPLOAD_DIR=/data/uploads)
app.upload-dir=${UPLOAD_DIR:src/main/resources/static/uploads}

# ---------- Mail (ดึงจาก Environment Variables) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- แอดมินคนแรก (AdminSeeder) ----------
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:}
